name: Build and test

on:
  push:
    branches: [main, 'codex/**', 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless. Runs on main always finish,
# so every commit there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Test
        run: dotnet test -c Release --no-build --logger trx --collect:"XPlat Code Coverage" --results-directory TestResults
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          retention-days: 14

  # Separate job: a newly published advisory for a dependency must be visible, but it should not
  # turn an unrelated change red. Whether this job blocks a merge is a branch-protection choice.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore
      - name: Check for vulnerable packages
        run: |
          report="$(dotnet list DiskStats.slnx package --vulnerable --include-transitive 2>&1)"
          echo "$report"
          if echo "$report" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages found (see the report above)."
            exit 1
          fi

  # Compares the MFT scan with the directory scan on a real NTFS volume (a virtual disk with
  # hardlinks, compressed and sparse files, a junction, a data stream, a long path, 3000 files).
  # Synthetic records test the parser; only this job tests that the result matches what Windows
  # reports. Windows runners are administrators, which the test needs to attach the disk.
  ntfs-differential:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore tests/DiskStats.Core.Tests
      - name: Build
        run: dotnet build tests/DiskStats.Core.Tests -c Release --no-restore
      - name: MFT scan vs. directory scan
        env:
          DISKSTATS_VHD_TESTS: '1'
        run: dotnet test tests/DiskStats.Core.Tests -c Release --no-build --filter "FullyQualifiedName~NtfsDifferentialTests" --logger "console;verbosity=detailed"
